<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Barisan & Deret Aritmetika - SMP</title>
<style>
  /* ===== Gaya dasar ===== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #ede9fe, #ddd6fe);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    color: #1e293b;
  }

  .wadah {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(76, 29, 149, 0.15);
    padding: 20px;
    margin-top: 8px;
  }

  h1 {
    font-size: 1.15rem;
    text-align: center;
    color: #6d28d9;
    margin-bottom: 4px;
  }

  .subjudul {
    text-align: center;
    font-size: 0.8rem;
    color: #64748b;
    margin-bottom: 16px;
  }

  /* ===== Bilah kemajuan ===== */
  .info-atas {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #475569;
    margin-bottom: 6px;
  }

  .bar-luar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .bar-dalam {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b5cf6, #6d28d9);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* ===== Kartu soal ===== */
  .soal {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
    padding: 12px;
    background: #f5f3ff;
    border-left: 4px solid #8b5cf6;
    border-radius: 8px;
  }

  /* ===== Tombol pilihan ===== */
  .pilihan {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .tombol-pilihan {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 14px;
    font-size: 0.95rem;
    text-align: left;
    background: #f1f5f9;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    font-family: inherit;
    color: #1e293b;
  }

  .tombol-pilihan:hover:not(:disabled) {
    background: #ede9fe;
    border-color: #c4b5fd;
  }

  .tombol-pilihan:active:not(:disabled) {
    transform: scale(0.98);
  }

  .tombol-pilihan:disabled {
    cursor: default;
  }

  .huruf {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 0.8rem;
    border-radius: 50%;
    background: #cbd5e1;
    color: #334155;
  }

  /* Warna jawaban benar / salah */
  .benar {
    background: #dcfce7 !important;
    border-color: #22c55e !important;
  }
  .benar .huruf {
    background: #22c55e;
    color: #ffffff;
  }

  .salah {
    background: #fee2e2 !important;
    border-color: #ef4444 !important;
  }
  .salah .huruf {
    background: #ef4444;
    color: #ffffff;
  }

  /* ===== Umpan balik ===== */
  .umpan-balik {
    font-size: 0.88rem;
    line-height: 1.5;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: none;
  }

  .umpan-balik.tampil {
    display: block;
  }

  .umpan-balik.ok {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
  }

  .umpan-balik.gagal {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  /* ===== Tombol navigasi ===== */
  .tombol-utama {
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    color: #ffffff;
    background: linear-gradient(90deg, #8b5cf6, #6d28d9);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .tombol-utama:hover:not(:disabled) {
    opacity: 0.92;
  }

  .tombol-utama:active:not(:disabled) {
    transform: scale(0.98);
  }

  .tombol-utama:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
  }

  /* ===== Layar hasil ===== */
  .layar-hasil {
    display: none;
    text-align: center;
  }

  .layar-hasil.tampil {
    display: block;
  }

  .skor-besar {
    font-size: 3rem;
    font-weight: 800;
    color: #6d28d9;
    line-height: 1;
    margin: 10px 0;
  }

  .pesan-hasil {
    font-size: 1rem;
    color: #475569;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .rincian {
    text-align: left;
    font-size: 0.85rem;
    background: #f8fafc;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 18px;
    max-height: 200px;
    overflow-y: auto;
  }

  .rincian div {
    padding: 6px 0;
    border-bottom: 1px solid #e2e8f0;
  }

  .rincian div:last-child {
    border-bottom: none;
  }

  .ikon-benar { color: #16a34a; font-weight: 700; }
  .ikon-salah { color: #dc2626; font-weight: 700; }

  /* Sembunyikan layar kuis saat hasil tampil */
  .layar-kuis.sembunyi {
    display: none;
  }

  /* Notasi pangkat / indeks (sub & sup) */
  sup, sub {
    font-size: 0.75em;
  }
</style>
</head>
<body>

<div class="wadah">
  <h1>Kuis Barisan &amp; Deret Aritmetika</h1>
  <p class="subjudul">10 soal pilihan ganda untuk siswa SMP</p>

  <!-- ================= LAYAR KUIS ================= -->
  <div class="layar-kuis" id="layarKuis">
    <div class="info-atas">
      <span id="labelSoal">Soal 1 dari 10</span>
      <span id="labelSkor">Skor: 0</span>
    </div>
    <div class="bar-luar">
      <div class="bar-dalam" id="barDalam"></div>
    </div>

    <div class="soal" id="teksSoal">Memuat soal...</div>
    <div class="pilihan" id="wadahPilihan"></div>
    <div class="umpan-balik" id="umpanBalik"></div>

    <button class="tombol-utama" id="tombolLanjut" disabled>Pilih jawaban dulu</button>
  </div>

  <!-- ================= LAYAR HASIL ================= -->
  <div class="layar-hasil" id="layarHasil">
    <h2 style="font-size:1.1rem;color:#334155;">Hasil Kuis</h2>
    <div class="skor-besar" id="skorAkhir">0/10</div>
    <p class="pesan-hasil" id="pesanHasil"></p>
    <div class="rincian" id="rincianJawaban"></div>
    <button class="tombol-utama" id="tombolUlang">Ulangi Kuis</button>
  </div>
</div>

<script>
/* =====================================================
   DATA SOAL BARISAN & DERET ARITMETIKA
   Setiap soal: teks (boleh pakai tag HTML <sup>/<sub>),
   pilihan jawaban, indeks benar, dan pembahasan.
   ===================================================== */
const DAFTAR_SOAL = [
  {
    teks: "Barisan aritmetika: 3, 7, 11, 15, ... Beda (b) barisan tersebut adalah ...",
    pilihan: ["3", "4", "5", "7"],
    benar: 1,
    pembahasan: "b = U₂ − U₁ = 7 − 3 = 4."
  },
  {
    teks: "Suku ke-5 dari barisan 2, 5, 8, 11, ... adalah ...",
    pilihan: ["12", "13", "14", "15"],
    benar: 2,
    pembahasan: "Uₙ = a + (n−1)b = 2 + (5−1)·3 = 2 + 12 = 14."
  },
  {
    teks: "Rumus suku ke-n barisan aritmetika adalah ...",
    pilihan: [
      "U<sub>n</sub> = a + nb",
      "U<sub>n</sub> = a + (n−1)b",
      "U<sub>n</sub> = a · b<sup>n</sup>",
      "U<sub>n</sub> = a − (n−1)b"
    ],
    benar: 1,
    pembahasan: "Suku ke-n barisan aritmetika: Uₙ = a + (n−1)b, dengan a = suku pertama dan b = beda."
  },
  {
    teks: "Suku pertama barisan aritmetika 8, 5, 2, −1, ... adalah ...",
    pilihan: ["−1", "2", "5", "8"],
    benar: 3,
    pembahasan: "Suku pertama (a) adalah suku paling awal, yaitu 8. Bedanya b = 5 − 8 = −3."
  },
  {
    teks: "Diketahui barisan aritmetika dengan a = 4 dan b = 6. Suku ke-10 adalah ...",
    pilihan: ["54", "58", "60", "64"],
    benar: 1,
    pembahasan: "U₁₀ = a + 9b = 4 + 9·6 = 4 + 54 = 58."
  },
  {
    teks: "Jumlah 5 suku pertama dari barisan 2, 4, 6, 8, ... adalah ...",
    pilihan: ["20", "25", "30", "35"],
    benar: 2,
    pembahasan: "Sₙ = n/2 · (2a + (n−1)b) = 5/2 · (4 + 4·2) = 5/2 · 12 = 30."
  },
  {
    teks: "Rumus jumlah n suku pertama deret aritmetika adalah ...",
    pilihan: [
      "S<sub>n</sub> = n/2 · (a + U<sub>n</sub>)",
      "S<sub>n</sub> = n · (a + U<sub>n</sub>)",
      "S<sub>n</sub> = 2n · (a + U<sub>n</sub>)",
      "S<sub>n</sub> = n/2 · (a − U<sub>n</sub>)"
    ],
    benar: 0,
    pembahasan: "Jumlah n suku pertama: Sₙ = n/2 · (a + Uₙ) atau Sₙ = n/2 · (2a + (n−1)b)."
  },
  {
    teks: "Barisan aritmetika: 10, 14, 18, 22, ... Suku ke-15 adalah ...",
    pilihan: ["62", "64", "66", "68"],
    benar: 2,
    pembahasan: "a = 10, b = 4. U₁₅ = 10 + 14·4 = 10 + 56 = 66."
  },
  {
    teks: "Jumlah 10 suku pertama deret aritmetika 1 + 3 + 5 + 7 + ... adalah ...",
    pilihan: ["90", "95", "100", "110"],
    benar: 2,
    pembahasan: "S₁₀ = 10/2 · (2·1 + 9·2) = 5 · (2 + 18) = 5 · 20 = 100."
  },
  {
    teks: "Dalam suatu deret aritmetika diketahui U₃ = 11 dan U₇ = 27. Beda (b) deret tersebut adalah ...",
    pilihan: ["3", "4", "5", "6"],
    benar: 1,
    pembahasan: "U₇ − U₃ = (7−3)b → 27 − 11 = 4b → 16 = 4b → b = 4."
  }
];

/* =====================================================
   VARIABEL STATUS KUIS
   ===================================================== */
let indeksSoal = 0;        // soal yang sedang dikerjakan (0-9)
let skor = 0;              // jumlah jawaban benar
let sudahMenjawab = false; // apakah soal saat ini sudah dijawab
let catatanJawaban = [];   // menyimpan hasil tiap soal untuk layar hasil

/* =====================================================
   REFERENSI ELEMEN DOM
   ===================================================== */
const layarKuis      = document.getElementById("layarKuis");
const layarHasil     = document.getElementById("layarHasil");
const labelSoal      = document.getElementById("labelSoal");
const labelSkor      = document.getElementById("labelSkor");
const barDalam       = document.getElementById("barDalam");
const teksSoal       = document.getElementById("teksSoal");
const wadahPilihan   = document.getElementById("wadahPilihan");
const umpanBalik     = document.getElementById("umpanBalik");
const tombolLanjut   = document.getElementById("tombolLanjut");
const skorAkhir      = document.getElementById("skorAkhir");
const pesanHasil     = document.getElementById("pesanHasil");
const rincianJawaban = document.getElementById("rincianJawaban");
const tombolUlang    = document.getElementById("tombolUlang");

const HURUF_PILIHAN = ["A", "B", "C", "D"];

/* =====================================================
   FUNGSI: TAMPILKAN SOAL SAAT INI
   ===================================================== */
function tampilkanSoal() {
  const soal = DAFTAR_SOAL[indeksSoal];
  sudahMenjawab = false;

  // Perbarui info atas
  labelSoal.textContent = `Soal ${indeksSoal + 1} dari ${DAFTAR_SOAL.length}`;
  labelSkor.textContent = `Skor: ${skor}`;
  barDalam.style.width = `${(indeksSoal / DAFTAR_SOAL.length) * 100}%`;

  // Tampilkan teks soal (pakai innerHTML agar <sup>/<sub> tampil)
  teksSoal.innerHTML = soal.teks;

  // Buat tombol pilihan
  wadahPilihan.innerHTML = "";
  soal.pilihan.forEach((opsi, i) => {
    const btn = document.createElement("button");
    btn.className = "tombol-pilihan";
    btn.innerHTML = `<span class="huruf">${HURUF_PILIHAN[i]}</span><span>${opsi}</span>`;
    btn.addEventListener("click", () => periksaJawaban(i));
    wadahPilihan.appendChild(btn);
  });

  // Reset umpan balik dan tombol lanjut
  umpanBalik.className = "umpan-balik";
  umpanBalik.textContent = "";
  tombolLanjut.disabled = true;
  tombolLanjut.textContent = "Pilih jawaban dulu";
}

/* =====================================================
   FUNGSI: PERIKSA JAWABAN YANG DIPILIH
   ===================================================== */
function periksaJawaban(indeksDipilih) {
  if (sudahMenjawab) return; // cegah klik ganda
  sudahMenjawab = true;

  const soal = DAFTAR_SOAL[indeksSoal];
  const semuaTombol = wadahPilihan.querySelectorAll(".tombol-pilihan");

  // Nonaktifkan semua tombol
  semuaTombol.forEach(btn => (btn.disabled = true));

  // Tandai jawaban benar
  semuaTombol[soal.benar].classList.add("benar");

  // Tandai jawaban salah jika pilihan pengguna keliru
  if (indeksDipilih !== soal.benar) {
    semuaTombol[indeksDipilih].classList.add("salah");
  } else {
    skor++;
  }

  // Simpan catatan untuk layar hasil (hapus tag HTML agar ringkas)
  catatanJawaban.push({
    teks: soal.teks.replace(/<[^>]+>/g, ""),
    benar: indeksDipilih === soal.benar
  });

  // Tampilkan umpan balik
  umpanBalik.classList.add("tampil", indeksDipilih === soal.benar ? "ok" : "gagal");
  umpanBalik.textContent =
    (indeksDipilih === soal.benar ? "Benar! " : "Belum tepat. ") + soal.pembahasan;

  // Perbarui skor dan tombol lanjut
  labelSkor.textContent = `Skor: ${skor}`;
  tombolLanjut.disabled = false;
  tombolLanjut.textContent =
    indeksSoal === DAFTAR_SOAL.length - 1 ? "Lihat Hasil" : "Soal Berikutnya";
}

/* =====================================================
   FUNGSI: LANJUT KE SOAL BERIKUTNYA ATAU HASIL
   ===================================================== */
function lanjut() {
  if (indeksSoal < DAFTAR_SOAL.length - 1) {
    indeksSoal++;
    tampilkanSoal();
  } else {
    tampilkanHasil();
  }
}

/* =====================================================
   FUNGSI: TAMPILKAN LAYAR HASIL
   ===================================================== */
function tampilkanHasil() {
  layarKuis.classList.add("sembunyi");
  layarHasil.classList.add("tampil");

  const total = DAFTAR_SOAL.length;
  skorAkhir.textContent = `${skor}/${total}`;

  // Pesan motivasi berdasarkan skor
  let pesan;
  if (skor === total) {
    pesan = "Luar biasa! Semua jawaban benar. Kamu menguasai barisan dan deret aritmetika!";
  } else if (skor >= 8) {
    pesan = "Hebat! Pemahamanmu tentang barisan dan deret aritmetika sudah sangat baik.";
  } else if (skor >= 6) {
    pesan = "Bagus! Sedikit lagi, pelajari kembali rumus Uₙ dan Sₙ ya.";
  } else if (skor >= 4) {
    pesan = "Cukup baik. Yuk latihan lebih banyak soal barisan dan deret aritmetika.";
  } else {
    pesan = "Jangan menyerah! Pelajari kembali rumus Uₙ = a + (n−1)b dan Sₙ, lalu coba lagi.";
  }
  pesanHasil.textContent = pesan;

  // Rincian tiap soal
  rincianJawaban.innerHTML = "";
  catatanJawaban.forEach((catatan, i) => {
    const baris = document.createElement("div");
    baris.innerHTML = catatan.benar
      ? `<span class="ikon-benar">✓</span> Soal ${i + 1}: ${catatan.teks}`
      : `<span class="ikon-salah">✗</span> Soal ${i + 1}: ${catatan.teks}`;
    rincianJawaban.appendChild(baris);
  });
}

/* =====================================================
   FUNGSI: ULANGI KUIS DARI AWAL
   ===================================================== */
function ulangiKuis() {
  indeksSoal = 0;
  skor = 0;
  sudahMenjawab = false;
  catatanJawaban = [];

  layarHasil.classList.remove("tampil");
  layarKuis.classList.remove("sembunyi");

  tampilkanSoal();
}

/* =====================================================
   PASANG EVENT & MULAI
   ===================================================== */
tombolLanjut.addEventListener("click", lanjut);
tombolUlang.addEventListener("click", ulangiKuis);

// Mulai kuis saat halaman dimuat
tampilkanSoal();
</script>

</body>
</html>
